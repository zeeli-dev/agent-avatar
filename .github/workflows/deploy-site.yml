name: Deploy site

# Deploys the docs to https://avatars.zeeli.dev on every push to main.
# Enable by adding the repo variable CLOUDFLARE_ACCOUNT_ID and the secret CLOUDFLARE_API_TOKEN
# (token template "Edit Cloudflare Workers", scoped to the zeeli.dev zone).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://avatars.zeeli.dev
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
